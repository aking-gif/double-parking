<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مركز الإعلانات — أرسان</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#15181B;--surface:#1C2125;--surface-2:#22282D;
    --line:#2B3238;--line-2:#394148;
    --ink:#F5F2EB;--ink-2:#CFC9BC;--ink-3:#9C968F;--ink-4:#7C7871;
    --accent:#E8A547;--accent-soft:rgba(232,165,71,.12);--accent-line:rgba(232,165,71,.30);
    --green:#9CB57A;--red:#D86B5C;--orange:#E8A35C;
    --radius:10px;--mono:'IBM Plex Mono',monospace;
  }
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px 60px}
  .statusbar{background:rgba(10,11,13,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:7px 28px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--ink-3);display:flex;align-items:center;gap:24px;text-transform:uppercase}
  .statusbar .dot{width:6px;height:6px;border-radius:50%;background:#9CB57A;box-shadow:0 0 6px #9CB57A;display:inline-block}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 0;margin-bottom:24px}
  .topbar-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;color:#0a0a0a;overflow:hidden}
  .brand-name{font-weight:700;font-size:13px;letter-spacing:.5px}
  .brand-name .accent{color:var(--accent)}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .page-sub{font-size:12px;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center}
  .stat .num{font-size:28px;font-weight:700;color:var(--accent);font-family:var(--mono)}
  .stat .lbl{font-size:11px;color:var(--ink-3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  .filter{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .filter button{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit}
  .filter button:hover,.filter button.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s}
  .item:hover{border-color:var(--line-2)}
  .item.urgent{border-right:3px solid var(--red)}
  .item.unread{border-right:3px solid var(--accent)}
  .item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;background:var(--ink-4)}
  .item.unread .item-dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .item.urgent .item-dot{background:var(--red);box-shadow:0 0 6px var(--red)}
  .item-body{flex:1}
  .item-title{font-size:14px;font-weight:600;margin-bottom:4px}
  .item-meta{font-size:11px;color:var(--ink-3);display:flex;gap:12px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono)}
  .item-body p{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.6}
  .empty{text-align:center;padding:80px 20px;color:var(--ink-3)}
</style>
<script src="brand.js"></script>
<link rel="stylesheet" href="arsann-fonts.css">
</head>
<body>
<div class="statusbar">
  <span class="dot"></span> <b style="color:var(--ink)">SYSTEM ONLINE</b>
  <span style="margin-right:auto"></span>
  <span>ARSANN <span style="margin:0 4px">/</span> OS <span style="margin:0 4px">/</span> <span style="color:var(--accent)">ANNOUNCEMENTS</span></span>
</div>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-brand" onclick="location.href='spine.html'">
      <div class="brand-mark" id="ann-brand-logo"><img src="arsann-logo.svg" alt="Arsann" style="width:20px;height:20px;object-fit:contain;filter:brightness(0)" onerror="this.style.display='none'"></div>
      <div>
        <div class="brand-name">THE SPINE <span class="accent">/ ARSANN</span></div>
      </div>
    </div>
    <div>
      <div class="page-title">مركز الإعلانات</div>
      <div class="page-sub">ANNOUNCEMENTS CENTER</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="s-total">0</div><div class="lbl">إجمالي الإعلانات</div></div>
    <div class="stat"><div class="num" id="s-unread">0</div><div class="lbl">غير مقروء</div></div>
    <div class="stat"><div class="num" id="s-urgent">0</div><div class="lbl">عاجل</div></div>
  </div>
  <div class="filter">
    <button class="active" data-f="all">الكل</button>
    <button data-f="unread">غير مقروء</button>
    <button data-f="urgent">العاجل فقط</button>
  </div>
  <div id="list"></div>
</div>

<script>window.API_BASE = "https://arsan-api.a-king-6e1.workers.dev";</script>
<script>
(async function(){
  const READ_KEY = 'arsan_notif_read_v1';
  function getRead(){ try { return new Set(JSON.parse(localStorage.getItem(READ_KEY)||'[]')); } catch(_){ return new Set(); } }
  function setRead(s){ localStorage.setItem(READ_KEY, JSON.stringify([...s])); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmt(ts){ const d=new Date(ts); const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

  async function load(){
    try {
      const token = localStorage.getItem('arsan_token_v1') || localStorage.getItem('arsan_token') || '';
      const res = await fetch(window.API_BASE + '/api/announcements', { headers: token ? {'Authorization':'Bearer '+token} : {} });
      if (res.ok) {
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data.list || data.announcements || []);
        if (arr.length) return arr;
      }
    } catch(_){}
    try {
      const cached = JSON.parse(localStorage.getItem('arsan_announcements_v1')||'[]');
      if (cached.length) return cached;
    } catch(_){}
    // Demo data when API unavailable and no cache
    return [
      { id:'d1', title:'مرحباً بكم في أرسان OS', body:'المنصة الآن جاهزة للتشغيل. يمكنكم البدء باستخدام جميع الوحدات.', priority:'info', author:'الإدارة', ts: Date.now()-86400000 },
      { id:'d2', title:'تحديث النظام v2.4', body:'تم تحديث جميع الصفحات بهوية The Spine الموحدة.', priority:'info', author:'الإدارة', ts: Date.now()-3600000 }
    ];
  }

  let filter = 'all';
  let all = [];

  function render(){
    const read = getRead();
    let list = all;
    if (filter === 'unread') list = list.filter(a => !read.has(a.id));
    if (filter === 'urgent') list = list.filter(a => a.priority === 'urgent');

    document.getElementById('s-total').textContent = all.length;
    document.getElementById('s-unread').textContent = all.filter(a=>!read.has(a.id)).length;
    document.getElementById('s-urgent').textContent = all.filter(a=>a.priority==='urgent').length;

    const wrap = document.getElementById('list');
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">لا توجد إعلانات في هذا التصنيف</div>';
      return;
    }
    wrap.innerHTML = list.map(a => `
      <div class="item ${(a.priority==='urgent'||a.kind==='urgent')?'urgent':''}">
        <div class="ttl">
          ${(a.priority==='urgent'||a.kind==='urgent') ? '<span class="urg">عاجل</span>' : ''}
          ${esc(a.title||'')}
        </div>
        <div class="body">${esc(a.body||a.text||'')}</div>
        <div class="meta">
          <span>${esc(a.author||'')}</span>
          <span>${fmt(a.ts||Date.now())}</span>
        </div>
      </div>`).join('');
  }

  document.querySelectorAll('.filter button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      filter = b.dataset.f;
      render();
    };
  });

  all = await load();
  // Sort newest first
  all.sort((a,b) => (b.ts||0) - (a.ts||0));
  render();
  // Mark all as read after viewing
  setTimeout(() => {
    setRead(new Set(all.map(a=>a.id)));
    render();
  }, 1500);
})();
</script>
  <script src="spine-back.js" defer></script>
  <script src="spine-search.js" defer></script>
<script src="quick-capture.js?v=1"></script>
<script src="notif-center.js?v=1"></script>
<script>
(function tryInjectLogo(){
  const el=document.getElementById('ann-brand-logo');
  if(el&&window.ArsanBrand&&window.ArsanBrand.logo){el.innerHTML=window.ArsanBrand.logo(28,'#E8A547');return;}
  if(el)setTimeout(tryInjectLogo,100);
})();
</script>
</body>
</html>
