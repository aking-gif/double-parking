<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>أرسان — المنصة التنفيذية</title>
<link rel="icon" href="arsann-logo.svg">
<script>
  /* ============================================================
     ENTRY ROUTER — The Spine is the home hub.
     · First visit this session → play the OS boot, which lands on the Spine.
     · Already booted → go straight to the Spine.
     The Spine itself handles login and lets the user choose where to go.
     ============================================================ */
  (function () {
    try {
      if (!sessionStorage.getItem('os-booted')) {
        sessionStorage.setItem('os-booted', '1');
        window.location.replace('landing-os.html');
      } else {
        window.location.replace('spine.html');
      }
    } catch (e) {
      window.location.replace('spine.html');
    }
  })();
</script>
<style>
  html,body{margin:0;height:100%;background:#15181B;color:#9C968F;
    font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:13px;letter-spacing:.04em}
  .dot{width:7px;height:7px;border-radius:50%;background:#E8A547;animation:p 1s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
  a{color:#E8A547}
</style>
</head>
<body>
  <div class="wrap">
    <span class="dot"></span>
    <span>جارٍ فتح المنصة… إن لم تُفتح تلقائياً <a href="spine.html">اضغط هنا</a></span>
  </div>
</body>
</html>
