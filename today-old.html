<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>اليوم · Arsann</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script>window.API_BASE = 'https://arsan-api.a-king-6e1.workers.dev';</script>
<style>
:root{
  --bg-1: #0a0c10;
  --bg-2: #14161c;
  --bg-3: #1c1f27;
  --ink-1: #f5f1ea;
  --ink-2: rgba(245,241,234,.7);
  --ink-3: rgba(245,241,234,.45);
  --ink-4: rgba(245,241,234,.25);
  --line: rgba(255,255,255,.08);
  --line-2: rgba(255,255,255,.04);
  --brand: #E8A860;
  --brand-2: #C98F47;
  --blue: #87C0FF;
  --green: #87E0A8;
  --red: #FF8888;
  --yellow: #FFD060;
  --purple: #C087FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-1);color:var(--ink-1);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(232,168,96,.06), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(96,160,232,.04), transparent 60%),
    var(--bg-1);
}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.3px}

/* ===== Header ===== */
.header{
  padding:32px 40px 24px;
  display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.header .left{display:flex;flex-direction:column;gap:6px}
.greet{font-size:13px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;letter-spacing:1px;text-transform:uppercase}
.date-big{font-size:34px;font-weight:300;letter-spacing:-.5px;color:var(--ink-1)}
.date-big strong{font-weight:600;color:var(--brand)}
.header .right{display:flex;gap:8px;flex-wrap:wrap}
.h-stat{
  padding:10px 14px; border-radius:10px;
  background:rgba(255,255,255,.03); border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.h-stat .num{font-size:20px;font-weight:600;color:var(--ink-1);font-family:'IBM Plex Mono',monospace}
.h-stat .lbl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px}
.h-stat.hot .num{color:var(--red)}
.h-stat.due .num{color:var(--yellow)}
.h-stat.done .num{color:var(--green)}

/* ===== Main grid ===== */
.main{
  padding:24px 40px 80px;
  display:grid; grid-template-columns: 1fr 1fr 380px; gap:20px;
}
@media (max-width: 1280px){ .main{grid-template-columns: 1fr 1fr} .col-side{grid-column:1/-1} }
@media (max-width: 800px){ .main{grid-template-columns:1fr;padding:20px} .header{padding:24px 20px 16px} }

.section{
  background:rgba(255,255,255,.02);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}
.section-head{
  padding:14px 18px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--line-2);
}
.section-head h3{
  font-size:13px; font-weight:600; color:var(--ink-1);
  display:flex; align-items:center; gap:10px;
  letter-spacing:.3px;
}
.section-head h3 .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--brand); box-shadow:0 0 12px currentColor;
}
.section-head h3.blue .dot{background:var(--blue);color:var(--blue)}
.section-head h3.green .dot{background:var(--green);color:var(--green)}
.section-head h3.red .dot{background:var(--red);color:var(--red)}
.section-head h3.purple .dot{background:var(--purple);color:var(--purple)}
.section-head .count{
  font-family:'IBM Plex Mono',monospace; font-size:11px;
  color:var(--ink-3); padding:3px 8px; border-radius:6px;
  background:rgba(255,255,255,.04);
}
.section-head .more{
  font-size:11px; color:var(--ink-3); text-decoration:none;
  font-family:'IBM Plex Mono',monospace; letter-spacing:.5px;
  transition:color .15s;
}
.section-head .more:hover{color:var(--brand)}

.list{ max-height: 480px; overflow-y:auto }
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

.item{
  padding:12px 18px; border-bottom:1px solid var(--line-2);
  display:flex; gap:12px; align-items:flex-start;
  cursor:pointer; transition:background .15s; position:relative;
}
.item:hover{background:rgba(255,255,255,.03)}
.item:last-child{border-bottom:none}
.item .check{
  flex:0 0 18px; width:18px; height:18px; border-radius:5px;
  border:1.5px solid var(--ink-4); margin-top:2px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .15s;
}
.item .check:hover{border-color:var(--green)}
.item .check.done{background:var(--green);border-color:var(--green)}
.item .check.done svg{display:block}
.item .check svg{display:none;width:11px;height:11px;color:#0a0c10}
.item.completed .title{text-decoration:line-through;color:var(--ink-3)}

.item .body{flex:1;min-width:0}
.item .title{font-size:13.5px;color:var(--ink-1);line-height:1.45;margin-bottom:4px;font-weight:500}
.item .meta{font-size:11px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .meta .sep{opacity:.4}
.item .pri{
  display:inline-block; padding:1px 6px; border-radius:4px;
  font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
}
.item .pri.urgent{background:rgba(255,136,136,.15);color:var(--red)}
.item .pri.high{background:rgba(255,208,96,.15);color:var(--yellow)}
.item .pri.normal{display:none}
.item .pri.low{background:rgba(255,255,255,.05);color:var(--ink-3)}

.item .time{
  flex:0 0 auto; font-family:'IBM Plex Mono',monospace; font-size:11px;
  color:var(--ink-3); padding:3px 8px; border-radius:5px;
  background:rgba(255,255,255,.03);
}
.item .time.overdue{color:var(--red);background:rgba(255,136,136,.08)}
.item .time.now{color:var(--green);background:rgba(135,224,168,.08)}

/* Meeting card */
.meet-item{
  padding:14px 18px; border-bottom:1px solid var(--line-2);
  display:flex; gap:14px; cursor:pointer; transition:background .15s;
}
.meet-item:hover{background:rgba(255,255,255,.03)}
.meet-item:last-child{border-bottom:none}
.meet-time{
  flex:0 0 56px; text-align:center;
  padding:8px 6px; border-radius:8px;
  background:rgba(96,160,232,.08); border:1px solid rgba(96,160,232,.18);
}
.meet-time .h{font-size:18px;font-weight:600;color:var(--blue);font-family:'IBM Plex Mono',monospace;line-height:1}
.meet-time .d{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.meet-body{flex:1;min-width:0}
.meet-title{font-size:13.5px;color:var(--ink-1);font-weight:500;margin-bottom:4px}
.meet-meta{font-size:11px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace}

/* Side column */
.col-side{display:flex;flex-direction:column;gap:20px}

/* Empty state */
.empty{
  padding:40px 20px; text-align:center; color:var(--ink-3);
  font-size:13px;
}
.empty svg{width:36px;height:36px;opacity:.25;margin-bottom:10px;display:block;margin:0 auto 10px}

/* Quick stat tile */
.tile{
  padding:18px 20px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--line);
  border-radius:14px;
  display:flex;justify-content:space-between;align-items:flex-start;
  cursor:pointer; transition:all .15s;
}
.tile:hover{background:rgba(255,255,255,.04);border-color:rgba(232,168,96,.3)}
.tile .label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1.2px;font-family:'IBM Plex Mono',monospace}
.tile .value{font-size:28px;font-weight:300;color:var(--ink-1);margin-top:6px;letter-spacing:-.5px}
.tile .delta{font-size:11px;color:var(--green);margin-top:4px;font-family:'IBM Plex Mono',monospace}
.tile .delta.down{color:var(--red)}
.tile .icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(232,168,96,.12);color:var(--brand);
}
.tile .icon svg{width:16px;height:16px;stroke-width:1.8}
.tile.blue .icon{background:rgba(96,160,232,.12);color:var(--blue)}
.tile.green .icon{background:rgba(135,224,168,.12);color:var(--green)}
.tile.purple .icon{background:rgba(168,128,232,.12);color:var(--purple)}

/* Top bar nav */
.topbar{
  height:54px;
  background:rgba(20,22,28,.6); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; position:sticky; top:0; z-index:100;
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.5px}
.topbar .brand .logo{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:flex;align-items:center;justify-content:center;color:#1a1410;font-weight:700;
}
.topbar .nav{display:flex;gap:4px}
.topbar .nav a{
  padding:6px 12px; border-radius:7px;
  color:var(--ink-2); text-decoration:none; font-size:13px;
  transition:all .15s;
}
.topbar .nav a:hover{background:rgba(255,255,255,.05);color:var(--ink-1)}
.topbar .nav a.active{background:rgba(232,168,96,.15);color:var(--brand)}
.topbar .right{display:flex;gap:8px;align-items:center}
.topbar input[type="search"]{
  background:rgba(255,255,255,.04); border:1px solid var(--line);
  border-radius:8px; padding:7px 12px; color:var(--ink-1);
  font-family:inherit; font-size:13px; width:240px;
}
.topbar input[type="search"]:focus{outline:none;border-color:var(--brand)}

/* Loading shimmer */
@keyframes shimmer{0%{opacity:.4}50%{opacity:.7}100%{opacity:.4}}
.loading-row{padding:12px 18px;border-bottom:1px solid var(--line-2)}
.loading-row .bar{height:12px;background:rgba(255,255,255,.05);border-radius:4px;animation:shimmer 1.5s infinite}
.loading-row .bar.short{width:60%;margin-top:6px;height:9px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="logo">A</span><span>Arsann</span></div>
  <nav class="nav">
    <a href="spine.html">الرئيسية</a>
    <a href="today.html" class="active">اليوم</a>
    <a href="dashboard.html">SOPs</a>
    <a href="calendar.html">التقويم</a>
    <a href="mail.html">البريد</a>
    <a href="crm.html">CRM</a>
  </nav>
  <div class="right">
    <input type="search" placeholder="بحث… (⌘K)"/>
  </div>
</div>

<div class="header">
  <div class="left">
    <div class="greet" id="greet">صباح الخير</div>
    <div class="date-big" id="dateBig">—</div>
  </div>
  <div class="right">
    <div class="h-stat hot"><span class="num" id="sOver">0</span><span class="lbl">متأخّرة</span></div>
    <div class="h-stat due"><span class="num" id="sDue">0</span><span class="lbl">اليوم</span></div>
    <div class="h-stat"><span class="num" id="sMeet">0</span><span class="lbl">اجتماعات</span></div>
    <div class="h-stat done"><span class="num" id="sDone">0</span><span class="lbl">أنجزت</span></div>
  </div>
</div>

<div class="main">
  <!-- Tasks column -->
  <section class="section">
    <div class="section-head">
      <h3 class="blue"><span class="dot"></span> مهامّك</h3>
      <a class="more" href="spine.html#tasks">عرض الكل ↗</a>
    </div>
    <div class="list" id="tasksList">
      <div class="loading-row"><div class="bar"></div><div class="bar short"></div></div>
      <div class="loading-row"><div class="bar"></div><div class="bar short"></div></div>
      <div class="loading-row"><div class="bar"></div><div class="bar short"></div></div>
    </div>
  </section>

  <!-- Meetings + Mail column -->
  <section class="section">
    <div class="section-head">
      <h3 class="green"><span class="dot"></span> اجتماعات اليوم</h3>
      <a class="more" href="calendar.html">التقويم ↗</a>
    </div>
    <div class="list" id="meetList">
      <div class="loading-row"><div class="bar"></div><div class="bar short"></div></div>
    </div>
  </section>

  <!-- Side column -->
  <div class="col-side">
    <div class="tile blue" onclick="location.href='mail.html'">
      <div>
        <div class="label">الوارد</div>
        <div class="value" id="tMail">—</div>
        <div class="delta" id="tMailDelta">جديد</div>
      </div>
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
    </div>
    <div class="tile green" onclick="location.href='crm.html'">
      <div>
        <div class="label">صفقات قيد المتابعة</div>
        <div class="value" id="tDeals">—</div>
        <div class="delta" id="tDealsDelta">قيمة الـ Pipeline</div>
      </div>
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
    </div>
    <div class="tile" onclick="location.href='announcements.html'">
      <div>
        <div class="label">إعلانات جديدة</div>
        <div class="value" id="tAnn">—</div>
        <div class="delta" id="tAnnDelta">آخر 7 أيام</div>
      </div>
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
    </div>
    <div class="tile purple" onclick="location.href='dashboard.html'">
      <div>
        <div class="label">SOPs محدّثة</div>
        <div class="value" id="tSops">—</div>
        <div class="delta" id="tSopsDelta">هذا الأسبوع</div>
      </div>
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    </div>
  </div>

  <!-- Recent activity (full width below) -->
  <section class="section" style="grid-column:1/-1">
    <div class="section-head">
      <h3 class="purple"><span class="dot"></span> آخر النشاطات</h3>
      <a class="more" href="spine.html">المنصّة ↗</a>
    </div>
    <div class="list" id="activityList">
      <div class="loading-row"><div class="bar"></div><div class="bar short"></div></div>
      <div class="loading-row"><div class="bar"></div><div class="bar short"></div></div>
    </div>
  </section>
</div>

<script>
const API = window.API_BASE;
const TOK = localStorage.getItem('arsan_token_v1') || localStorage.getItem('arsan_token') || '';
const ME = (() => { try { return JSON.parse(localStorage.getItem('arsan_me')||'null'); } catch { return null; } })();
const headers = TOK ? { 'Authorization': 'Bearer ' + TOK } : {};

// ===== Greeting & date =====
function setGreeting(){
  const h = new Date().getHours();
  let g = 'صباح الخير';
  if (h >= 5 && h < 12) g = 'صباح الخير';
  else if (h >= 12 && h < 17) g = 'مساء الخير';
  else if (h >= 17 && h < 22) g = 'مساء النور';
  else g = 'سهرة سعيدة';
  const name = ME?.email?.split('@')[0] || '';
  document.getElementById('greet').textContent = g + (name ? ' · ' + name : '');

  const d = new Date();
  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  document.getElementById('dateBig').innerHTML =
    `${days[d.getDay()]} <strong>${d.getDate()}</strong> ${months[d.getMonth()]}`;
}
setGreeting();

// ===== Helpers =====
function fmtTimeAgo(ts){
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 60000) return 'الآن';
  if (d < 3600000) return Math.floor(d/60000) + ' د';
  if (d < 86400000) return Math.floor(d/3600000) + ' س';
  return Math.floor(d/86400000) + ' يوم';
}
function isToday(ts){
  const d = new Date(ts);
  const t = new Date();
  return d.toDateString() === t.toDateString();
}
function isOverdue(dueStr){
  if (!dueStr) return false;
  const d = new Date(dueStr);
  d.setHours(23,59,59);
  return d.getTime() < Date.now();
}
function dueLabel(dueStr){
  if (!dueStr) return '';
  const d = new Date(dueStr);
  const t = new Date();
  const diff = Math.floor((d - t) / 86400000);
  if (d.toDateString() === t.toDateString()) return 'اليوم';
  if (diff === 1) return 'غداً';
  if (diff === -1) return 'أمس';
  if (diff < 0) return Math.abs(diff) + ' ي متأخر';
  if (diff < 7) return 'خلال ' + diff + ' ي';
  return d.toLocaleDateString('ar-SA', { month:'short', day:'numeric' });
}

// ===== Load tasks =====
async function loadTasks(){
  const list = document.getElementById('tasksList');
  try {
    const r = await fetch(API + '/api/tasks', { headers });
    const data = r.ok ? await r.json() : [];
    const tasks = (Array.isArray(data) ? data : []).filter(t => t.status !== 'done' && t.status !== 'completed');

    // Sort: overdue first, then today, then upcoming
    tasks.sort((a, b) => {
      const aOver = isOverdue(a.dueDate);
      const bOver = isOverdue(b.dueDate);
      if (aOver && !bOver) return -1;
      if (bOver && !aOver) return 1;
      const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
      const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
      return ad - bd;
    });

    const overdue = tasks.filter(t => isOverdue(t.dueDate)).length;
    const dueToday = tasks.filter(t => t.dueDate && new Date(t.dueDate).toDateString() === new Date().toDateString()).length;
    const done = (Array.isArray(data) ? data : []).filter(t => (t.status === 'done' || t.status === 'completed') && t.completedAt && isToday(t.completedAt)).length;

    document.getElementById('sOver').textContent = overdue;
    document.getElementById('sDue').textContent = dueToday;
    document.getElementById('sDone').textContent = done;

    if (tasks.length === 0){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><div>لا مهام مفتوحة — رائع! 🎯</div></div>';
      return;
    }

    list.innerHTML = tasks.slice(0, 12).map(t => {
      const over = isOverdue(t.dueDate);
      const today = t.dueDate && new Date(t.dueDate).toDateString() === new Date().toDateString();
      return `
        <div class="item" data-id="${t.id}">
          <div class="check" onclick="toggleTask('${t.id}', event)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="body">
            <div class="title">${escapeHtml(t.title || '(بدون عنوان)')}</div>
            <div class="meta">
              ${t.priority && t.priority !== 'normal' ? `<span class="pri ${t.priority}">${t.priority==='urgent'?'عاجلة':t.priority==='high'?'عالية':'منخفضة'}</span>` : ''}
              ${t.assignee ? `<span>${escapeHtml(t.assignee.split('@')[0])}</span><span class="sep">·</span>` : ''}
              ${t.source ? `<span>${escapeHtml(t.source)}</span>` : ''}
            </div>
          </div>
          ${t.dueDate ? `<div class="time ${over?'overdue':today?'now':''}">${dueLabel(t.dueDate)}</div>` : ''}
        </div>`;
    }).join('');
  } catch (e){
    list.innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

async function toggleTask(id, evt){
  evt.stopPropagation();
  const check = evt.currentTarget;
  check.classList.add('done');
  check.closest('.item').classList.add('completed');
  try {
    await fetch(API + '/api/tasks/' + id, {
      method: 'PATCH', headers: { ...headers, 'Content-Type':'application/json' },
      body: JSON.stringify({ status: 'done', completedAt: Date.now() })
    });
    setTimeout(loadTasks, 600);
  } catch {}
}

// ===== Load meetings =====
async function loadMeetings(){
  const list = document.getElementById('meetList');
  try {
    const r = await fetch(API + '/api/kv/meetings_v1', { headers });
    const data = r.ok ? await r.json() : [];
    const arr = Array.isArray(data) ? data : (data ? Object.values(data) : []);
    const today = arr.filter(m => m && m.startsAt && isToday(m.startsAt)).sort((a,b)=>a.startsAt-b.startsAt);

    document.getElementById('sMeet').textContent = today.length;

    if (today.length === 0){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg><div>لا اجتماعات اليوم</div></div>';
      return;
    }

    list.innerHTML = today.slice(0, 8).map(m => {
      const d = new Date(m.startsAt);
      return `
        <div class="meet-item">
          <div class="meet-time">
            <div class="h">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div>
            <div class="d">${m.duration || 30}م</div>
          </div>
          <div class="meet-body">
            <div class="meet-title">${escapeHtml(m.title || 'اجتماع')}</div>
            <div class="meet-meta">${(m.attendees||[]).length} مشاركين · ${escapeHtml(m.location || (m.meetUrl?'افتراضي':'—'))}</div>
          </div>
        </div>`;
    }).join('');
  } catch {
    list.innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

// ===== Load activity =====
async function loadActivity(){
  const list = document.getElementById('activityList');
  try {
    const r = await fetch(API + '/api/activity?limit=20', { headers });
    const data = r.ok ? await r.json() : [];
    const arr = Array.isArray(data) ? data : [];
    if (arr.length === 0){
      list.innerHTML = '<div class="empty">لا نشاط حديث</div>';
      return;
    }
    list.innerHTML = arr.slice(0, 12).map(a => `
      <div class="item">
        <div class="body">
          <div class="title">${escapeHtml(a.actor || a.email || 'مستخدم')} — ${escapeHtml(a.action || '')}${a.target ? ' · ' + escapeHtml(a.target) : ''}</div>
          <div class="meta"><span>${escapeHtml(a.module || a.kind || '')}</span></div>
        </div>
        <div class="time">${fmtTimeAgo(a.ts || a.createdAt)}</div>
      </div>
    `).join('');
  } catch {
    list.innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

// ===== Load side tiles =====
async function loadSideTiles(){
  // Mail count
  try {
    const r = await fetch(API + '/api/kv/mail_inbox_v1', { headers });
    if (r.ok){
      const m = await r.json();
      const arr = Array.isArray(m) ? m : (m?Object.values(m):[]);
      const unread = arr.filter(x => x && !x.read).length;
      document.getElementById('tMail').textContent = unread;
      document.getElementById('tMailDelta').textContent = unread === 0 ? 'صندوق فارغ' : 'غير مقروء';
    } else { document.getElementById('tMail').textContent = '0'; }
  } catch { document.getElementById('tMail').textContent = '—'; }

  // Deals
  try {
    const r = await fetch(API + '/api/kv/crm_deals_v1', { headers });
    if (r.ok){
      const d = await r.json();
      const arr = Array.isArray(d) ? d : (d?Object.values(d):[]);
      const open = arr.filter(x => x && x.stage !== 'won' && x.stage !== 'lost');
      document.getElementById('tDeals').textContent = open.length;
      const sum = open.reduce((a,b)=>a+(parseFloat(b.value)||0), 0);
      document.getElementById('tDealsDelta').textContent = sum > 0 ? sum.toLocaleString('ar-SA') + ' ر.س' : 'قيد المتابعة';
    } else { document.getElementById('tDeals').textContent = '0'; }
  } catch { document.getElementById('tDeals').textContent = '—'; }

  // Announcements
  try {
    const r = await fetch(API + '/api/announcements', { headers });
    if (r.ok){
      const a = await r.json();
      const arr = Array.isArray(a) ? a : [];
      const week = arr.filter(x => (x.createdAt||x.ts||0) > Date.now() - 7*86400000);
      document.getElementById('tAnn').textContent = week.length;
    } else { document.getElementById('tAnn').textContent = '0'; }
  } catch { document.getElementById('tAnn').textContent = '—'; }

  // SOPs
  try {
    const r = await fetch(API + '/api/kv/sops_v1', { headers });
    if (r.ok){
      const s = await r.json();
      const arr = Array.isArray(s) ? s : (s?Object.values(s):[]);
      const week = arr.filter(x => x && (x.updatedAt||0) > Date.now() - 7*86400000);
      document.getElementById('tSops').textContent = week.length;
    } else { document.getElementById('tSops').textContent = '0'; }
  } catch { document.getElementById('tSops').textContent = '—'; }
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== Init =====
loadTasks();
loadMeetings();
loadActivity();
loadSideTiles();
setInterval(() => { loadTasks(); loadMeetings(); }, 60000);

// Update time every minute
setInterval(setGreeting, 60000);
</script>
<script src="quick-capture.js?v=2"></script>
<script src="notif-center.js?v=1"></script>
</body>
