<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>اليوم · Arsann</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script>window.API_BASE='https://arsan-api.a-king-6e1.workers.dev';</script>
<style>
:root{
  --bg: #FBFAF7;
  --surface: #FFFFFF;
  --line: #ECE9E2;
  --line-2: #D9D5CC;
  --ink: #1A1815;
  --ink-2: #5C5852;
  --ink-3: #8A857C;
  --ink-4: #B8B3A8;
  --accent: #C98F47;
  --accent-soft: #F5EBD9;
  --green: #4A8F5C;
  --red: #B8453E;
  --blue: #3A6FB0;
  --r: 10px;
  --r-lg: 14px;
}
[data-theme="dark"]{
  --bg: #0E0F12;
  --surface: #16181D;
  --line: #23252C;
  --line-2: #2E3138;
  --ink: #F2EFE8;
  --ink-2: #B5B0A6;
  --ink-3: #807B72;
  --ink-4: #4A4640;
  --accent: #E8A860;
  --accent-soft: rgba(232,168,96,.12);
  --green: #87C99B;
  --red: #E88080;
  --blue: #87B0E8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.serif{font-family:'Amiri',Georgia,serif}

/* === Top bar === */
.tb{
  height:56px;padding:0 32px;display:flex;align-items:center;gap:24px;
  border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;z-index:50;
}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600}
.tb-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tb-nav{display:flex;gap:2px}
.tb-nav a{padding:7px 12px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:14px}
.tb-nav a:hover{background:var(--accent-soft);color:var(--ink)}
.tb-nav a.on{color:var(--ink);font-weight:600}
.tb-nav a.on::after{content:'';display:block;height:2px;background:var(--accent);margin-top:4px;border-radius:2px}
.tb-search{
  flex:1;max-width:420px;margin-inline-start:auto;
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink-3);font-size:13px;cursor:pointer;
}
.tb-search:hover{border-color:var(--line-2)}
.tb-kbd{margin-inline-start:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-3);background:var(--bg);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.tb-icon{
  width:34px;height:34px;border-radius:8px;background:transparent;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;
}
.tb-icon:hover{background:var(--surface);color:var(--ink)}
.tb-icon svg{width:16px;height:16px;stroke-width:1.8}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}

/* === Page === */
.wrap{max-width:1200px;margin:0 auto;padding:48px 32px 80px}
@media(max-width:720px){.wrap{padding:28px 20px 60px}.tb{padding:0 16px;gap:12px}.tb-search{display:none}}

.hero{margin-bottom:48px}
.hero-date{font-size:13px;color:var(--ink-3);letter-spacing:.5px;margin-bottom:8px}
.hero-h1{font-size:clamp(36px,5vw,52px);font-weight:400;line-height:1.2;letter-spacing:-1px}
.hero-h1 .name{color:var(--accent);font-weight:600}
.hero-sub{font-size:16px;color:var(--ink-2);margin-top:12px;line-height:1.6;max-width:560px}
.hero-sub .em{color:var(--ink);font-weight:600}

/* === Section === */
.section{margin-bottom:48px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.sec-title{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.5px;text-transform:uppercase}
.sec-link{font-size:13px;color:var(--ink-3);text-decoration:none}
.sec-link:hover{color:var(--accent)}

/* === Tasks list === */
.task{
  display:flex;align-items:center;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
  transition:background 120ms;
}
.task:last-child{border-bottom:none}
.task:hover{background:var(--surface);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:var(--r)}
.task-check{
  flex:0 0 18px;width:18px;height:18px;border-radius:5px;
  border:1.5px solid var(--ink-4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 120ms;
}
.task-check:hover{border-color:var(--green)}
.task-check.done{background:var(--green);border-color:var(--green)}
.task-check svg{display:none;width:11px;height:11px;color:#fff}
.task-check.done svg{display:block}
.task.completed .task-title{text-decoration:line-through;color:var(--ink-3)}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;color:var(--ink);font-weight:500;line-height:1.4}
.task-meta{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;align-items:center}
.task-pri{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px}
.task-pri.urgent{background:var(--red);color:#fff}
.task-pri.high{background:var(--accent-soft);color:var(--accent)}
.task-due{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.task-due.overdue{color:var(--red);font-weight:600}
.task-due.now{color:var(--green);font-weight:600}

/* === Stats row === */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:20px 24px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:none}
@media(max-width:720px){.stat{border-inline-start:none;border-top:1px solid var(--line)}.stat:first-child,.stat:nth-child(2){border-top:none}.stat:nth-child(odd){border-inline-start:1px solid var(--line)}}
.stat-num{font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1;font-family:'Amiri',Georgia,serif}
.stat-label{font-size:12px;color:var(--ink-3);margin-top:8px;letter-spacing:.3px}
.stat-trend{font-size:11px;color:var(--green);margin-top:6px;font-variant-numeric:tabular-nums}
.stat.warn .stat-num{color:var(--red)}

/* === Two columns === */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media(max-width:900px){.cols{grid-template-columns:1fr;gap:32px}}

/* === Meetings === */
.meet{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.meet:last-child{border-bottom:none}
.meet-time{flex:0 0 54px;text-align:center;padding:10px 0;background:var(--accent-soft);border-radius:var(--r);color:var(--accent)}
.meet-time .h{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.meet-time .d{font-size:10px;margin-top:4px;color:var(--ink-3)}
.meet-info{flex:1;min-width:0}
.meet-title{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:2px}
.meet-sub{font-size:12px;color:var(--ink-3)}

/* === Empty === */
.empty{padding:32px 0;text-align:center;color:var(--ink-3);font-size:14px}

/* === Quiet links / tiles === */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}}
.tile-mini{
  padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);cursor:pointer;transition:all 120ms;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  text-decoration:none;color:inherit;
}
.tile-mini:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile-mini-num{font-size:24px;font-weight:500;font-family:'Amiri',serif;line-height:1}
.tile-mini-label{font-size:13px;color:var(--ink-2);margin-top:4px}
.tile-mini-arrow{color:var(--ink-3);font-size:18px}

/* Pulse dot */
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(74,143,92,.5)}70%{box-shadow:0 0 0 6px rgba(74,143,92,0)}100%{box-shadow:0 0 0 0 rgba(74,143,92,0)}}
</style>
</head>
<body>

<header class="tb">
  <a href="spine.html" class="tb-brand"><span class="tb-mark">A</span><span>Arsann</span></a>
  <nav class="tb-nav">
    <a href="spine.html">الرئيسية</a>
    <a href="today.html" class="on">اليوم</a>
    <a href="dashboard.html">الإجراءات</a>
    <a href="calendar.html">التقويم</a>
    <a href="mail.html">البريد</a>
  </nav>
  <div class="tb-search" onclick="document.getElementById('searchTrigger')?.click()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>ابحث في كل شيء</span>
    <span class="tb-kbd">⌘K</span>
  </div>
  <button class="tb-icon" id="themeBtn" title="تبديل الوضع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
  </button>
  <button class="tb-icon" title="الإشعارات">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </button>
  <div class="tb-avatar" id="avatar">أ</div>
</header>

<main class="wrap">
  <div class="hero">
    <div class="hero-date" id="dateLine">—</div>
    <h1 class="hero-h1 serif" id="greeting">مساء الخير</h1>
    <p class="hero-sub" id="summary"><span class="pulse"></span> &nbsp; جارٍ التحميل…</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat warn" id="statOverdue">
      <div class="stat-num" id="nOverdue">—</div>
      <div class="stat-label">مهام متأخّرة</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="nToday">—</div>
      <div class="stat-label">اليوم</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="nMeet">—</div>
      <div class="stat-label">اجتماعات</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="nDone">—</div>
      <div class="stat-label">أنجزت اليوم</div>
    </div>
  </div>

  <div style="height:48px"></div>

  <!-- Two columns: Tasks | Meetings -->
  <div class="cols">
    <section class="section" style="margin:0">
      <div class="sec-head">
        <div class="sec-title">مهامّك</div>
        <a class="sec-link" href="spine.html#tasks">عرض الكل ←</a>
      </div>
      <div id="tasksList"><div class="empty">جارٍ التحميل…</div></div>
    </section>

    <section class="section" style="margin:0">
      <div class="sec-head">
        <div class="sec-title">اجتماعات اليوم</div>
        <a class="sec-link" href="calendar.html">التقويم ←</a>
      </div>
      <div id="meetList"><div class="empty">جارٍ التحميل…</div></div>
    </section>
  </div>

  <div style="height:48px"></div>

  <!-- Quick links -->
  <section class="section">
    <div class="sec-head">
      <div class="sec-title">نظرة سريعة</div>
    </div>
    <div class="tiles">
      <a class="tile-mini" href="mail.html">
        <div><div class="tile-mini-num" id="nMail">—</div><div class="tile-mini-label">رسائل غير مقروءة</div></div>
        <span class="tile-mini-arrow">←</span>
      </a>
      <a class="tile-mini" href="crm.html">
        <div><div class="tile-mini-num" id="nDeals">—</div><div class="tile-mini-label">صفقات نشطة</div></div>
        <span class="tile-mini-arrow">←</span>
      </a>
      <a class="tile-mini" href="announcements.html">
        <div><div class="tile-mini-num" id="nAnn">—</div><div class="tile-mini-label">إعلانات هذا الأسبوع</div></div>
        <span class="tile-mini-arrow">←</span>
      </a>
    </div>
  </section>
</main>

<script>
const API=window.API_BASE;
const TOK=localStorage.getItem('arsan_token_v1')||localStorage.getItem('arsan_token')||'';
const ME=(()=>{try{return JSON.parse(localStorage.getItem('arsan_me')||'null')}catch{return null}})();
const headers=TOK?{'Authorization':'Bearer '+TOK}:{};

// Theme
const THEME_KEY='arsan_theme_v1';
const savedTheme=localStorage.getItem(THEME_KEY)||'light';
document.documentElement.setAttribute('data-theme',savedTheme);
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);
  localStorage.setItem(THEME_KEY,nx);
};

// Header
function setHeader(){
  const d=new Date();
  const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  document.getElementById('dateLine').textContent=`${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
  const h=d.getHours();
  const g=h<12?'صباح الخير':h<18?'مساء الخير':'مساء النور';
  const name=ME?.email?.split('@')[0]||'';
  document.getElementById('greeting').innerHTML=g+(name?'<span class="name">، '+name+'</span>':'');
  document.getElementById('avatar').textContent=(name[0]||'أ').toUpperCase();
}
setHeader();setInterval(setHeader,60000);

// Helpers
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isOverdue=s=>{if(!s)return false;const d=new Date(s);d.setHours(23,59,59);return d<Date.now()};
const isToday=ts=>{if(!ts)return false;return new Date(ts).toDateString()===new Date().toDateString()};
const dueLabel=s=>{if(!s)return'';const d=new Date(s),t=new Date(),diff=Math.floor((d-t)/86400000);if(d.toDateString()===t.toDateString())return'اليوم';if(diff===1)return'غداً';if(diff<0)return Math.abs(diff)+' ي متأخر';if(diff<7)return'خلال '+diff+' ي';return d.toLocaleDateString('ar-SA',{month:'short',day:'numeric'})};

// Load tasks
async function loadTasks(){
  let arr=[];
  try{const r=await fetch(API+'/api/tasks',{headers});if(r.ok){const d=await r.json();arr=Array.isArray(d)?d:[];}}catch{}
  const open=arr.filter(t=>t.status!=='done'&&t.status!=='completed');
  const overdue=open.filter(t=>isOverdue(t.dueDate));
  const today=open.filter(t=>t.dueDate&&new Date(t.dueDate).toDateString()===new Date().toDateString());
  const doneToday=arr.filter(t=>(t.status==='done'||t.status==='completed')&&t.completedAt&&isToday(t.completedAt));

  document.getElementById('nOverdue').textContent=overdue.length;
  document.getElementById('nToday').textContent=today.length;
  document.getElementById('nDone').textContent=doneToday.length;

  // Summary line
  const sumEl=document.getElementById('summary');
  if(overdue.length>0)sumEl.innerHTML=`<span class="pulse" style="background:var(--red)"></span> &nbsp; عندك <span class="em">${overdue.length} مهمة متأخّرة</span> و ${today.length} اليوم.`;
  else if(today.length>0)sumEl.innerHTML=`<span class="pulse"></span> &nbsp; <span class="em">${today.length} مهام</span> اليوم. الجدول هادئ.`;
  else sumEl.innerHTML=`<span class="pulse"></span> &nbsp; <span class="em">جدولك صافٍ.</span> وقت مناسب للأعمال العميقة.`;

  // List
  const list=document.getElementById('tasksList');
  if(open.length===0){list.innerHTML='<div class="empty">لا مهام مفتوحة 🎯</div>';return}
  open.sort((a,b)=>{const ao=isOverdue(a.dueDate),bo=isOverdue(b.dueDate);if(ao!==bo)return ao?-1:1;return(a.dueDate?new Date(a.dueDate):Infinity)-(b.dueDate?new Date(b.dueDate):Infinity)});
  list.innerHTML=open.slice(0,8).map(t=>`
    <div class="task" data-id="${t.id}">
      <div class="task-check" onclick="toggleTask('${t.id}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="task-body">
        <div class="task-title">${esc(t.title||'(بدون عنوان)')}</div>
        <div class="task-meta">
          ${t.priority&&t.priority!=='normal'?`<span class="task-pri ${t.priority}">${t.priority==='urgent'?'عاجلة':'عالية'}</span>`:''}
          ${t.assignee?`<span>${esc(t.assignee.split('@')[0])}</span>`:''}
        </div>
      </div>
      ${t.dueDate?`<span class="task-due ${isOverdue(t.dueDate)?'overdue':(new Date(t.dueDate).toDateString()===new Date().toDateString()?'now':'')}">${dueLabel(t.dueDate)}</span>`:''}
    </div>`).join('');
}
async function toggleTask(id,e){
  e.stopPropagation();
  const c=e.currentTarget;c.classList.add('done');c.closest('.task').classList.add('completed');
  try{await fetch(API+'/api/tasks/'+id,{method:'PATCH',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({status:'done',completedAt:Date.now()})})}catch{}
  setTimeout(loadTasks,700);
}
window.toggleTask=toggleTask;

async function loadMeetings(){
  let arr=[];
  try{const r=await fetch(API+'/api/kv/meetings_v1',{headers});if(r.ok){const d=await r.json();arr=Array.isArray(d)?d:(d?Object.values(d):[]);}}catch{}
  arr=arr.filter(m=>m&&m.startsAt&&isToday(m.startsAt)).sort((a,b)=>a.startsAt-b.startsAt);
  document.getElementById('nMeet').textContent=arr.length;
  const list=document.getElementById('meetList');
  if(arr.length===0){list.innerHTML='<div class="empty">لا اجتماعات اليوم</div>';return}
  list.innerHTML=arr.slice(0,6).map(m=>{const d=new Date(m.startsAt);return`
    <div class="meet">
      <div class="meet-time"><div class="h">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div><div class="d">${m.duration||30}م</div></div>
      <div class="meet-info"><div class="meet-title">${esc(m.title||'اجتماع')}</div><div class="meet-sub">${(m.attendees||[]).length} مشاركين${m.location?' · '+esc(m.location):''}</div></div>
    </div>`}).join('');
}

async function loadSide(){
  try{const r=await fetch(API+'/api/kv/mail_inbox_v1',{headers});if(r.ok){const d=await r.json();const a=Array.isArray(d)?d:(d?Object.values(d):[]);document.getElementById('nMail').textContent=a.filter(x=>x&&!x.read).length}else document.getElementById('nMail').textContent='0'}catch{document.getElementById('nMail').textContent='0'}
  try{const r=await fetch(API+'/api/kv/crm_deals_v1',{headers});if(r.ok){const d=await r.json();const a=Array.isArray(d)?d:(d?Object.values(d):[]);document.getElementById('nDeals').textContent=a.filter(x=>x&&x.stage!=='won'&&x.stage!=='lost').length}else document.getElementById('nDeals').textContent='0'}catch{document.getElementById('nDeals').textContent='0'}
  try{const r=await fetch(API+'/api/announcements',{headers});if(r.ok){const a=await r.json();const arr=Array.isArray(a)?a:[];document.getElementById('nAnn').textContent=arr.filter(x=>(x.createdAt||x.ts||0)>Date.now()-7*86400000).length}else document.getElementById('nAnn').textContent='0'}catch{document.getElementById('nAnn').textContent='0'}
}

loadTasks();loadMeetings();loadSide();
setInterval(()=>{loadTasks();loadMeetings()},60000);
</script>
<script src="quick-capture.js?v=2"></script>
<script src="notif-center.js?v=1"></script>
</body>
