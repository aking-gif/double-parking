name = "double-parking"
main = "worker.js"
compatibility_date = "2024-11-01"
account_id = "6e1bbf9595326b995e6f64e101d88b76"

[[kv_namespaces]]
binding = "ARSAN"
id = "8b9f150a311841d0a2409190a0ed8857"

# Declared explicitly. `wrangler deploy` reconciles triggers against this file,
# so omitting it can drop the schedule the dashboard configured — and the
# automations, digests and Gmail sync all hang off this tick.
[triggers]
crons = ["*/15 * * * *"]

# WARNING: this list is authoritative. `wrangler deploy` REPLACES the Worker's
# plaintext vars with exactly what is below — any var set only in the dashboard
# is deleted on deploy. Secrets are stored separately and are NOT affected.
# Anything sensitive, or anything that must survive a deploy, belongs in
# secrets rather than here.
[vars]
ADMIN_EMAIL = "a.king@arsann.com"
EDITOR_DOMAIN = "arsann.com"

# Secrets — encrypted, preserved across deploys. Set via:
#   wrangler secret put SECRET_NAME --name arsan-api
# Confirmed present on arsan-api as of 2026-07-15:
#   ADMIN_BOOTSTRAP_PASSWORD, ANTHROPIC_API_KEY, FROM_EMAIL, GOOGLE_CLIENT_ID,
#   GOOGLE_CLIENT_SECRET, RESEND_API_KEY, SLACK_BOT_TOKEN, SLACK_WEBHOOK_URL
# RESEND_API_KEY and FROM_EMAIL were plaintext dashboard vars until 2026-07-15;
# both are now secrets, so a deploy can no longer silently drop them.
